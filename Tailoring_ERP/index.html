<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AtelierHQ — Order management for tailoring shops</title>
    <meta
      name="description"
      content="Orders, customers, worker tasks, payments, and invoices — all in one elegant workspace for your tailoring business."
    />
    <meta name="author" content="AtelierHQ" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:title" content="AtelierHQ" />
    <meta
      property="og:description"
      content="Orders, customers, worker tasks, payments, and invoices — all in one elegant workspace for your tailoring business."
    />
    <meta property="og:type" content="website" />

    <!-- Fonts — Cormorant Garamond (headings) + DM Sans (body). Weights
         chosen to match what's actually used in src/ (see font-weight class
         grep): 300/400/500/600/700 on Cormorant, 300/400/500/600 on DM Sans,
         no italic (nothing pairs italic with either serif face). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
      crossorigin
    />

    <!-- Detect dark mode preference and set the class before next-themes loads. This avoids a flash of unstyled content (FOUC) when the page loads. -->
    <script>
      try {
        let theme = localStorage.getItem("theme");
        if (theme === "system" || !theme) {
          let prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          theme = prefersDark ? "dark" : "light";
        }
        document.documentElement.classList.add(theme);
      } catch (e) {}
    </script>

    <link href="/src/index.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
